user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log  /var/log/nginx/access.log;

    map $http_origin $cors_origin {
        default $http_origin;
    }

    # ВАЖНО: Кэш для MinIO должен быть здесь, в контексте http, а не внутри location!
    proxy_cache_path /var/cache/nginx/minio levels=1:2 keys_zone=minio_cache:10m max_size=100m inactive=60m use_temp_path=off;

    server {
        listen 80;
        server_name _;
        client_max_body_size 0;
        client_body_buffer_size 128k;
        client_body_in_file_only on;
        client_body_temp_path /var/cache/nginx/client_temp 1 2;
        root /usr/share/nginx/html;
        index index.html;

        location /api/auth/ {
            proxy_pass http://auth-app:8080/api/auth/;
            include snippets/proxy_params.conf;
            include snippets/cors_options.conf;
        }

        location /api/visits/ {
            proxy_pass http://auth-app:8080/api/visits/;
            include snippets/proxy_params.conf;
            include snippets/cors_options.conf;
        }

        location /api/users/ {
            proxy_pass http://users-app:8081/api/users/;
            include snippets/proxy_params.conf;
            include snippets/cors_options.conf;
        }
        
        location /api/characters/ {
            proxy_pass http://characters-app:8082/api/characters/;
            include snippets/proxy_params.conf;
            include snippets/cors_options.conf;
        }

        location /api/slots/ {
            proxy_pass http://characters-app:8082/api/slots/;
            include snippets/proxy_params.conf;
            include snippets/cors_options.conf;
        }
        
        location /api/notebook/ {
            proxy_pass http://characters-app:8082/api/notebook/;
            include snippets/proxy_params.conf;
            include snippets/cors_options.conf;
        }

        location /api/panels/ {
            proxy_pass http://characters-app:8082/api/panels/;
            include snippets/proxy_params.conf;
            include snippets/cors_options.conf;
        }

        location /api/email/ {
            proxy_pass http://email-app:8083/api/email/;
            include snippets/proxy_params.conf;
            include snippets/cors_options.conf;
        }
        
        location /api/files/ {
            proxy_pass http://file-storage-app:8084/api/files/;
            include snippets/proxy_params.conf;
            include snippets/cors_options.conf;
        }

        location /api/captcha/ {
            proxy_pass http://captcha-app:8085/api/captcha/;
            include snippets/proxy_params.conf;
            include snippets/cors_options.conf;
        }

        location /api/forum/ {
            proxy_pass http://forum-app:8086/api/forum/;
            include snippets/proxy_params.conf;
            include snippets/cors_options.conf;
        }

        location /api/messages/ {
            proxy_pass http://chat-app:8087/api/messages/;
            include snippets/proxy_params.conf;
            include snippets/cors_options.conf;
        }

        location /api/mails/ {
            proxy_pass http://chat-app:8087/api/mails/;
            include snippets/proxy_params.conf;
            include snippets/cors_options.conf;
        }

        location /api/categories/ {
            proxy_pass http://chat-app:8087/api/categories/;
            include snippets/proxy_params.conf;
            include snippets/cors_options.conf;
        }

        location /api/resources/ {
            proxy_pass http://mining-app:8088/api/resources/;
            include snippets/proxy_params.conf;
            include snippets/cors_options.conf;
        }

        location /api/items/ {
            proxy_pass http://mining-app:8088/api/items/;
            include snippets/proxy_params.conf;
            include snippets/cors_options.conf;
        }

        location /api/economy/ {
            proxy_pass http://economy-app:8090/api/economy/;
            include snippets/proxy_params.conf;
            include snippets/cors_options.conf;
        }

        location /api/messages/ws/chat/ {
            proxy_pass http://chat-app:8087/api/messages/ws/chat/;
            include snippets/proxy_params.conf;
        }

        # ЕДИНСТВЕННЫЙ блок для MinIO с кэшированием
        location ^~ /production-minio/ {
            # Слеш в конце ВАЖЕН: он автоматически убирает /production-minio/ из пути
            proxy_pass http://production-minio:9000/;
            
            proxy_set_header Host production-minio:9000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # ВАЖНО: proxy_buffering должен быть ВКЛЮЧЁН (по умолчанию), иначе nginx
            # не пишет ответы upstream в proxy_cache и кэширование не работает
            proxy_pass_request_headers on;

            proxy_cache minio_cache;
            proxy_cache_valid 200 1h;
            proxy_cache_valid 404 1m;
            
            add_header X-Cache-Status $upstream_cache_status;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
        }

        # Кэширование статических изображений на 1 год
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        location / {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires 0;
            try_files $uri /index.html;
        }

        location /assets/ {
            alias /usr/share/nginx/html/assets/;
            try_files $uri =404;
        }

        error_page 404 /404.html;
        location = /404.html {
            root /usr/share/nginx/html;
        }
    }
}