user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log  /var/log/nginx/access.log;

    map $http_origin $cors_origin {
        default $http_origin;
    }

    # ВАЖНО: Кэш для MinIO должен быть здесь, в контексте http, а не внутри location!
    proxy_cache_path /var/cache/nginx/minio levels=1:2 keys_zone=minio_cache:10m max_size=100m inactive=60m use_temp_path=off;

    # Docker DNS resolver
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream auth_app {
        server auth-app:8080 resolve;
        zone auth_app_zone 64k;
    }
    upstream captcha_app {
        server captcha-app:8085 resolve;
        zone captcha_app_zone 64k;
    }
    upstream characters_app {
        server characters-app:8082 resolve;
        zone characters_app_zone 64k;
    }
    upstream chat_app {
        server chat-app:8087 resolve;
        zone chat_app_zone 64k;
    }
    upstream economy_app {
        server economy-app:8090 resolve;
        zone economy_app_zone 64k;
    }
    upstream email_app {
        server email-app:8083 resolve;
        zone email_app_zone 64k;
    }
    upstream file_storage_app {
        server file-storage-app:8084 resolve;
        zone file_storage_app_zone 64k;
    }
    upstream forum_app {
        server forum-app:8086 resolve;
        zone forum_app_zone 64k;
    }
    upstream mining_app {
        server mining-app:8088 resolve;
        zone mining_app_zone 64k;
    }
    upstream production_minio {
        server production-minio:9000 resolve;
        zone production_minio_zone 64k;
    }
    upstream users_app {
        server users-app:8081 resolve;
        zone users_app_zone 64k;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 0;
        client_body_buffer_size 128k;
        client_body_in_file_only on;
        client_body_temp_path /var/cache/nginx/client_temp 1 2;
        resolver 127.0.0.11 valid=10s ipv6=off;
        root /usr/share/nginx/html;
        index index.html;

        location /api/auth/ {
            proxy_pass http://auth_app/api/auth/;
            include snippets/proxy_params.conf;
            include snippets/cors_options.conf;
        }

        location /api/visits/ {
            proxy_pass http://auth_app/api/visits/;
            include snippets/proxy_params.conf;
            include snippets/cors_options.conf;
        }

        location /api/users/ {
            proxy_pass http://users_app/api/users/;
            include snippets/proxy_params.conf;
            include snippets/cors_options.conf;
        }
        
        location /api/characters/ {
            proxy_pass http://characters_app/api/characters/;
            include snippets/proxy_params.conf;
            include snippets/cors_options.conf;
        }

        location /api/slots/ {
            proxy_pass http://characters_app/api/slots/;
            include snippets/proxy_params.conf;
            include snippets/cors_options.conf;
        }
        
        location /api/notebook/ {
            proxy_pass http://characters_app/api/notebook/;
            include snippets/proxy_params.conf;
            include snippets/cors_options.conf;
        }

        location /api/panels/ {
            proxy_pass http://characters_app/api/panels/;
            include snippets/proxy_params.conf;
            include snippets/cors_options.conf;
        }

        location /api/email/ {
            proxy_pass http://email_app/api/email/;
            include snippets/proxy_params.conf;
            include snippets/cors_options.conf;
        }
        
        location /api/files/ {
            proxy_pass http://file_storage_app/api/files/;
            include snippets/proxy_params.conf;
            include snippets/cors_options.conf;
        }

        location /api/captcha/ {
            proxy_pass http://captcha_app/api/captcha/;
            include snippets/proxy_params.conf;
            include snippets/cors_options.conf;
        }

        location /api/forum/ {
            proxy_pass http://forum_app/api/forum/;
            include snippets/proxy_params.conf;
            include snippets/cors_options.conf;
        }

        location /api/messages/ {
            proxy_pass http://chat_app/api/messages/;
            include snippets/proxy_params.conf;
            include snippets/cors_options.conf;
        }

        location /api/mails/ {
            proxy_pass http://chat_app/api/mails/;
            include snippets/proxy_params.conf;
            include snippets/cors_options.conf;
        }

        location /api/categories/ {
            proxy_pass http://chat_app/api/categories/;
            include snippets/proxy_params.conf;
            include snippets/cors_options.conf;
        }

        location /api/resources/ {
            proxy_pass http://mining_app/api/resources/;
            include snippets/proxy_params.conf;
            include snippets/cors_options.conf;
        }

        location /api/items/ {
            proxy_pass http://mining_app/api/items/;
            include snippets/proxy_params.conf;
            include snippets/cors_options.conf;
        }

        location /api/economy/ {
            proxy_pass http://economy_app/api/economy/;
            include snippets/proxy_params.conf;
            include snippets/cors_options.conf;
        }

        location /api/messages/ws/chat/ {
            proxy_pass http://chat_app/api/messages/ws/chat/;
            include snippets/proxy_params.conf;
        }
        
        location /api/admin/ {
            proxy_pass http://mining_app/api/admin/;
            include snippets/proxy_params.conf;
            include snippets/cors_options.conf;
        }

        location /api/stats/ {
            proxy_pass http://characters_app/api/stats/;
            include snippets/proxy_params.conf;
            include snippets/cors_options.conf;
        }

        location /api/rest/ {
            proxy_pass http://characters_app/api/rest/;
            include snippets/proxy_params.conf;
            include snippets/cors_options.conf;
        }

        location /api/houses/ {
            proxy_pass http://characters_app/api/houses/;
            include snippets/proxy_params.conf;
            include snippets/cors_options.conf;
        }

        location /ws/character {
            proxy_pass http://characters_app/ws/character;
            include snippets/proxy_params.conf;
        }


        # ЕДИНСТВЕННЫЙ блок для MinIO с кэшированием
        location ^~ /production-minio/ {
            # Слеш в конце ВАЖЕН: он автоматически убирает /production-minio/ из пути
            proxy_pass http://production_minio/;
            
            proxy_set_header Host production-minio:9000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # ВАЖНО: proxy_buffering должен быть ВКЛЮЧЁН (по умолчанию), иначе nginx
            # не пишет ответы upstream в proxy_cache и кэширование не работает
            proxy_pass_request_headers on;

            proxy_cache minio_cache;
            proxy_cache_valid 200 1h;
            proxy_cache_valid 404 1m;
            
            add_header X-Cache-Status $upstream_cache_status;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
        }

        # Кэширование статических изображений на 1 год
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        location / {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires 0;
            try_files $uri /index.html;
        }

        location /assets/ {
            alias /usr/share/nginx/html/assets/;
            try_files $uri =404;
        }

        error_page 404 /404.html;
        location = /404.html {
            root /usr/share/nginx/html;
        }
    }
}