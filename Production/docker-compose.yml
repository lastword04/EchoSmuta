  production-redis:
    image: redis:latest
    container_name: production-redis
    ports:
      - "${REDIS_PORT}:6379"
    expose:
      - 6379
    volumes:
      - production-redis-data:/data
      - /usr/share/zoneinfo/UTC:/etc/localtime:ro
    networks:
      - production-main-network
    environment:
      REDIS_PASSWORD: '${REDIS_PASSWORD}'
      TZ: UTC
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
  
  production-celery-redis:
    image: redis:latest
    container_name: production-celery-redis
    ports:
      - "${REDIS_CELERY_PORT}:6379"
    expose:
      - 6379
    volumes:
      - production-celery-redis-data:/data
      - /usr/share/zoneinfo/UTC:/etc/localtime:ro
    networks:
      - production-main-network
    environment:
      REDIS_PASSWORD: '${REDIS_PASSWORD}'
      TZ: UTC
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]

  production-minio:
    image: minio/minio:latest
    container_name: production-minio

    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - production-minio-data:/data
    networks:
      - production-main-network
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      TZ: UTC
    command: server --console-address ":9001" /data
 
  celery-worker-auth:
    build:
      context: .
      dockerfile: ./docker/auth/Dockerfile

    container_name: celery-worker-auth
    restart: unless-stopped
    entrypoint: /docker/worker.sh
    environment:
      - TZ=UTC
    depends_on:
      - production-auth-service-db
      - auth-app
      - production-redis
      - production-celery-redis
    volumes:
      - ./services/auth/.:/app/
    networks:
      - production-main-network
  
  celery-beat-auth:
