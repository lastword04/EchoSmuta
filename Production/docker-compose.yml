      - AUTH_SERVICE_APP_CELERY__BROKER_URL=redis://:redis_password@production-celery-redis:6379/0
      - AUTH_SERVICE_APP_CELERY__RESULT_BACKEND=redis://:redis_password@production-celery-redis:6379/0
      - AUTH_SERVICE_APP_CELERY__REDBEAT_REDIS_URL=redis://:redis_password@production-celery-redis:6379/1
