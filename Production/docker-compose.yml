      - "9001:9001"
    volumes:
      - production-minio-data:/data
    networks:
      - production-main-network
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      TZ: UTC
    command: server --console-address ":9001" /data
 
