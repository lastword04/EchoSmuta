services:
  production-user-service-db:
    image: postgres:17-bookworm
    container_name: production-user-service-db
    environment:
      POSTGRES_USER: '${USER_DB_USER}'
      POSTGRES_PASSWORD: '${USER_DB_PASSWORD}'
      POSTGRES_DB: '${USER_DB_NAME}'
      TZ: UTC  # Добавьте это
      PGTZ: UTC  # И это для PostgreSQL
    ports:
      - '${USER_DB_PORT}:5432'
    expose:
      - 5432
    volumes:
      - production-user-service-data:/var/lib/postgresql/data
    networks:
      - production-main-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB_USER} -d ${USER_DB_NAME}"]
      interval: 10s
      timeout: 2s
      retries: 10

