  production-redis:
    image: redis:latest
    container_name: production-redis
    ports:
      - "${REDIS_PORT}:6379"
    expose:
      - 6379
    volumes:
      - production-redis-data:/data
      - /usr/share/zoneinfo/UTC:/etc/localtime:ro
    networks:
      - production-main-network
    environment:
      REDIS_PASSWORD: '${REDIS_PASSWORD}'
      TZ: UTC
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
  
  production-celery-redis:
    image: redis:latest
    container_name: production-celery-redis
    ports:
      - "${REDIS_CELERY_PORT}:6379"
    expose:
