  mining_service_db:
    image: postgres:17-bookworm
    container_name: mining_service_db
    environment:
      POSTGRES_USER: '${MINING_DB_USER}'
      POSTGRES_PASSWORD: '${MINING_DB_PASSWORD}'
      POSTGRES_DB: '${MINING_DB_NAME}'
    ports:
      - '${MINING_DB_PORT}:5432'
    expose:
      - 5432
    volumes:
      - mining_service_data:/var/lib/postgresql/data
    networks:
      - smyta_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MINING_DB_USER} -d ${MINING_DB_NAME}"]
      interval: 10s
      timeout: 2s
      retries: 10

  economy_service_db:
    image: postgres:17-bookworm
    container_name: economy_service_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: economy_service
    ports:
      - "5552:5432"
    expose:
      - 5432
    volumes:
      - economy_service_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d economy_service"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smyta_network	

  minio:
    image: pgsty/silo:latest
    ports:
      - "9003:9000"
      - "9004:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    networks:
      - smyta_network
    command: server --console-address ":9004" /data

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "${REDIS_PORT}:6379"
    expose:
      - 6379
    volumes:
      - redis_data:/data
    environment:
      REDIS_PASSWORD: '${REDIS_PASSWORD}'
    networks:
      - smyta_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]

volumes:
  user_service_data:
  character_service_data:
  auth_service_data:
  notification_email_service_data:
  file_storage_service_data:
  mining_service_data:
  minio_data:
  redis_data:
  forum_service_data:
  chat_service_data:
  economy_service_data:


networks:
  smyta_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24 
