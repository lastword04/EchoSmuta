services:
  user_service_db:
    image: postgres:17-bookworm
    container_name: user_service_db
    environment:
      POSTGRES_USER: '${USER_DB_USER}'
      POSTGRES_PASSWORD: '${USER_DB_PASSWORD}'
      POSTGRES_DB: '${USER_DB_NAME}'
    networks:
      - smyta_network
    ports:
      - '${USER_DB_PORT}:5432'
    expose:
      - 5432
    volumes:
      - user_service_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB_USER} -d ${USER_DB_NAME}"]
      interval: 10s
      timeout: 2s
      retries: 10

  character_service_db:
    image: postgres:17-bookworm
    container_name: character_service_db
    environment:
      POSTGRES_USER: '${CHARACTER_DB_USER}'
      POSTGRES_PASSWORD: '${CHARACTER_DB_PASSWORD}'
      POSTGRES_DB: '${CHARACTER_DB_NAME}'
    networks:
